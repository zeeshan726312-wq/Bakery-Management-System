<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyallpur Bakers - Customer Registration</title>
  <meta name="description" content="Create a customer account for Lyallpur Bakers Management System." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Ambient Glow Background -->
  <div class="bg-glow-container">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-icon">🛍️</div>
        <h1 class="brand-title font-serif-title">Create Account</h1>
        <p class="brand-subtitle">Join Lyallpur Bakers as a Customer to order fresh bakes</p>
      </div>

      <form id="registerForm" novalidate>
        <input type="hidden" id="role" name="role" value="customer" />

        <!-- Full Name -->
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <div class="input-container">
            <input type="text" id="name" class="form-input" placeholder="e.g. John Doe" required autocomplete="name" />
            <span class="input-icon">👤</span>
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-container">
            <input type="email" id="email" class="form-input" placeholder="name@lyallpurbakers.com" required autocomplete="email" />
            <span class="input-icon">✉️</span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-container">
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required />
            <span class="input-icon">🔒</span>
            <button type="button" class="toggle-password" data-target="password" title="Toggle password visibility">👁️</button>
          </div>
          <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-container">
            <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" required />
            <span class="input-icon">🔒</span>
            <button type="button" class="toggle-password" data-target="confirmPassword" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" style="margin-top: 1rem">
          <span>Create Customer Account</span>
          <span>→</span>
        </button>
      </form>

      <!-- Sign In Link -->
      <div style="text-align:center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-subtle)">
        Already have an account? 
        <a href="login.html" style="color: var(--warm-gold); font-weight:700; text-decoration:none; margin-left: 0.25rem;">Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
