<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakery Management System - Login</title>
  <meta name="description" content="Login page for Bakery Management System with Admin, Shopkeeper, and Customer roles.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Enable dark mode based on prefers-color-scheme
    tailwind.config = {
      darkMode: 'media',
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen">
  <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-8 w-full max-w-md glassmorphism">
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-6 text-center">Login</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
        <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
        <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="flex items-center justify-between">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition-colors">Sign In</button>
        <a href="register.html" class="text-indigo-600 hover:underline text-sm">Create account</a>
      </div>
    </form>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
