<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyallpur Bakers - Sign In</title>
  <meta name="description" content="Sign in to Lyallpur Bakers Management System with role-based access for Super Admin, Shopkeeper, and Customer." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Ambient Glow Background -->
  <div class="bg-glow-container">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-icon">🥐</div>
        <h1 class="brand-title font-serif-title">Lyallpur Bakers</h1>
        <p class="brand-subtitle">Handcrafted Oven Bakes • Select your role to enter</p>
      </div>

      <form id="loginForm" novalidate>
        <!-- Sign In Role Selector Cards -->
        <div class="form-group">
          <label class="form-label">Sign In As</label>
          <div class="role-selector">
            <label class="role-card">
              <input type="radio" name="loginRole" id="roleAdmin" value="admin" onclick="window.quickFillLogin('admin')" />
              <div class="role-card-inner">
                <span class="role-icon">👑</span>
                <span class="role-name">Admin</span>
              </div>
            </label>

            <label class="role-card">
              <input type="radio" name="loginRole" id="roleShopkeeper" value="shopkeeper" onclick="window.quickFillLogin('shopkeeper')" />
              <div class="role-card-inner">
                <span class="role-icon">🍞</span>
                <span class="role-name">Shopkeeper</span>
              </div>
            </label>

            <label class="role-card">
              <input type="radio" name="loginRole" id="roleCustomer" value="customer" checked onclick="window.quickFillLogin('customer')" />
              <div class="role-card-inner">
                <span class="role-icon">🛍️</span>
                <span class="role-name">Customer</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-container">
            <input type="email" id="email" class="form-input" placeholder="customer@lyallpurbakers.com" required autocomplete="email" />
            <span class="input-icon">✉️</span>
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center">
            <label for="password" class="form-label">Password</label>
            <span style="font-size:0.75rem; color:var(--warm-gold); font-weight:700">Default: password123</span>
          </div>
          <div class="input-container">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <span class="input-icon">🔒</span>
            <button type="button" class="toggle-password" data-target="password" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-primary">
          <span>Sign In to Lyallpur Bakers</span>
          <span>→</span>
        </button>
      </form>

      <!-- Quick Demo Accounts -->
      <div class="demo-pill-section">
        <div class="demo-title">⚡ Quick Demo Login</div>
        <div class="demo-pills">
          <button type="button" class="demo-pill" onclick="window.quickFillLogin('admin')">
            <span>👑 Super Admin</span>
          </button>
          <button type="button" class="demo-pill" onclick="window.quickFillLogin('shopkeeper')">
            <span>🍞 Shopkeeper Portal</span>
          </button>
          <button type="button" class="demo-pill" onclick="window.quickFillLogin('customer')">
            <span>🛍️ Customer Lounge</span>
          </button>
        </div>
      </div>

      <!-- Register Link -->
      <div style="text-align:center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-subtle)">
        Don't have an account? 
        <a href="register.html" style="color: var(--warm-gold); font-weight:700; text-decoration:none; margin-left: 0.25rem;">Create Customer Account</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
